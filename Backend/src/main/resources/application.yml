spring:
  flyway:
    enabled: true
    baseline-on-migrate: false
    locations: classpath:db/migration
  docker:
    compose:
      enabled: false
  security:
    oauth2:
      client:
        registration:
          jumpcloud:

            #christian just added this to connect the time we fix the .env file problem
            client-id: 9c839027-42b2-4219-a0ec-664a896f9813
            client-secret: bJd8zDtWfETF1npFmXm8WoSYym
            client-authentication-method: client_secret_post
            scope:
              - openid
              - profile
              - email
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/jumpcloud"
        provider:
          jumpcloud:
            issuer-uri: https://oauth.id.eu.jumpcloud.com/

  datasource:
    url: jdbc:postgresql://localhost:5432/ide_analyste
    username: analyste_user
    password: analyste_pass

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
logging:
  level:
    org.hibernate.SQL: DEBUG
    org.springframework.security: TRACE
server:
  servlet:
    session:
      cookie:
        same-site: lax
        secure: false # Mettre "true" le jour où on déploit sur un vrai serveur en HTTPScookie:
